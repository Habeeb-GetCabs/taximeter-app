name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project Files
        run: |
          unzip -o "*.zip"
          TARGET_DIR=$(dirname $(find . -mindepth 2 -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1))
          if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
            echo "Moving project from $TARGET_DIR to root..."
            cp -rn "$TARGET_DIR"/* .
            cp -rn "$TARGET_DIR"/.* . 2>/dev/null || true
          fi

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
